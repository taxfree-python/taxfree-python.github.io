  detailedDescription: "2024 年夏の国内インターンシップで着手した教育サービス開発を、パートタイムとして引き続き担当。現場の講師・先生へのヒアリングを通じて、学習者向けフィードバックにおける「望ましい応答条件」(言葉遣い、安全性、モチベーション維持、認知負荷など) を整理し、タスク特化の評価基準として体系化。これらの評価基準を踏まえ、LLM によるフィードバック生成 workflow を設計・実装。出力の傾向を確認しながら、プロンプト改善・仕様調整の反復サイクルを自ら回した。モデル側だけでなく、学習者にとって分かりやすい UI/UX の検討・プロトタイプ実装 (React) にも大きくコミット。インターン期間内に、現在のサービスの基盤となる構成 (画面遷移・機能構造・LLM workflow の接続) を設計し、フルタイムエンジニアと共同してプロダクト化を見据えた開発を推進。本プロジェクトで開発に携わったサービスは、やる気スイッチグループと PFN の合弁会社である YP スイッチから「AI 添削小論文対策講座」(https://ypswitch.jp/ai-syoron)として公開された。"
  achievements:
